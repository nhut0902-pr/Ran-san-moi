<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HƯƠNG NHỚ - Admin Waitlist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #b08d57;
            border-bottom: 2px solid #b08d57;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats {
            font-size: 14px;
            background: #b08d57;
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #fafafa;
            color: #666;
            text-transform: uppercase;
            font-size: 12px;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .date {
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            Danh sách đăng ký chờ (Waitlist)
            <span id="count" class="stats">0 người</span>
        </h1>
        <table id="waitlistTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Email</th>
                    <th>Ngày đăng ký</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchWaitlist() {
            try {
                const response = await fetch('/api/admin/waitlist');
                const data = await response.json();

                const tbody = document.querySelector('#waitlistTable tbody');
                const countSpan = document.getElementById('count');

                tbody.innerHTML = '';
                countSpan.textContent = `${data.length} người`;

                data.forEach((entry, index) => {
                    const row = document.createElement('tr');
                    const date = new Date(entry.date).toLocaleString('vi-VN');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${entry.email}</td>
                        <td class="date">${date}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error('Error fetching waitlist:', err);
            }
        }

        fetchWaitlist();
    </script>
</body>
</html>
