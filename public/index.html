<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hương Nhớ - Footwear Store Waitlist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="store-info">
          <div class="logo-box">
            <i class="bi bi-shop"></i>
          </div>
          <div class="text-info">
            <h1 class="store-name">Hương Nhớ</h1>
            <p class="store-tagline">FOOTWEAR STORE</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-icon"><i class="bi bi-bell-fill"></i></button>
          <button class="btn-icon"><i class="bi bi-search"></i></button>
        </div>
      </div>

      <!-- Top Navigation Tabs -->
      <div class="top-tabs">
        <button class="tab-item">Trang Chủ</button>
        <button class="tab-item">Sản Phẩm</button>
        <button class="tab-item active">Bảng Tin</button>
        <button class="tab-item">Giỏ Hàng</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
      <div id="waitlist-view" class="waitlist-container">
        <div class="empty-state-icon">
          <i class="bi bi-card-checklist"></i>
        </div>
        <h2 class="view-title">Tham gia Danh sách chờ</h2>
        <p class="view-description">Chúng tôi đang chuẩn bị những nội dung thú vị nhất cho bạn. Đăng ký ngay để nhận thông báo sớm nhất!</p>

        <form id="waitlistForm" class="waitlist-form mt-4">
          <div class="mb-3 text-start">
            <label for="fullname" class="form-label">Họ và tên</label>
            <input type="text" class="form-control" id="fullname" placeholder="Nhập tên của bạn" required>
          </div>
          <div class="mb-4 text-start">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="example@gmail.com" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 btn-submit">Tham gia ngay</button>
        </form>

        <div id="statusMessage" class="mt-3 d-none"></div>

        <div class="online-badge mt-5">
            <span class="dot"></span> Đang trực tuyến
        </div>
      </div>

      <!-- Floating Action Button -->
      <button class="fab">
        <i class="bi bi-chat-dots-fill"></i>
      </button>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <div class="nav-item">
        <i class="bi bi-house-door"></i>
        <span>Trang chủ</span>
      </div>
      <div class="nav-item">
        <i class="bi bi-grid"></i>
        <span>Danh mục</span>
      </div>
      <div class="nav-item active">
        <i class="bi bi-journal-text"></i>
        <span>Bảng tin</span>
      </div>
      <div class="nav-item">
        <i class="bi bi-heart"></i>
        <span>Yêu thích</span>
      </div>
      <div class="nav-item">
        <i class="bi bi-person"></i>
        <span>Tôi</span>
      </div>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
