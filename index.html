<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bóng Đá 1vs1 - Soccer Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">
  <div class="container py-4">
    <h1 class="text-center mb-4">⚽ Bóng Đá 1vs1</h1>

    <div class="row justify-content-center mb-4">
      <div class="col-md-10 col-lg-8">
        <div class="card bg-secondary text-white shadow">
          <div class="card-body">
            <div class="row g-3 align-items-end">
              <div class="col-6 col-md-4">
                <label for="modeSelect" class="form-label small">Chế độ</label>
                <select id="modeSelect" class="form-select bg-dark text-white border-secondary">
                  <option value="pva">Người vs Máy</option>
                  <option value="pvp">Người vs Người</option>
                </select>
              </div>
              <div id="aiDifficultyContainer" class="col-6 col-md-4">
                <label for="aiDifficulty" class="form-label small">Độ khó Máy</label>
                <select id="aiDifficulty" class="form-select bg-dark text-white border-secondary">
                  <option value="easy">Dễ</option>
                  <option value="medium" selected>Vừa</option>
                  <option value="hard">Khó</option>
                </select>
              </div>
              <div class="col-12 col-md-4 d-flex align-items-center justify-content-center">
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="soundToggle" checked>
                  <label class="form-check-label" for="soundToggle">Âm thanh</label>
                </div>
              </div>
              <div class="col-12 d-flex justify-content-center mt-3">
                <button id="startBtn" class="btn btn-success px-4 me-2">Bắt đầu</button>
                <button id="restartBtn" class="btn btn-warning px-4 d-none">Chơi lại</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-center gap-5 mb-3">
      <div class="text-center">
        <h6 id="p1Name">Người chơi 1</h6>
        <div class="p-2 bg-primary rounded shadow">
          <h4 class="mb-0"><span id="score1">0</span></h4>
        </div>
      </div>
      <div class="align-self-center">
        <h2 class="mb-0">-</h2>
      </div>
      <div class="text-center">
        <h6 id="p2Name">Máy</h6>
        <div class="p-2 bg-danger rounded shadow">
          <h4 class="mb-0"><span id="score2">0</span></h4>
        </div>
      </div>
    </div>

    <div class="game-container text-center position-relative">
      <canvas id="gameCanvas" width="800" height="400" class="shadow-lg"></canvas>

      <!-- Điều khiển ảo cho Mobile -->
      <div id="mobileControls" class="d-flex justify-content-between position-absolute w-100 px-3" style="bottom: 20px; left: 0; pointer-events: none;">
        <div class="d-flex gap-2" style="pointer-events: auto;">
          <button id="btnLeft" class="btn btn-dark opacity-75 rounded-circle p-3 shadow" style="width: 70px; height: 70px;">⬅️</button>
          <button id="btnRight" class="btn btn-dark opacity-75 rounded-circle p-3 shadow" style="width: 70px; height: 70px;">➡️</button>
        </div>
        <div style="pointer-events: auto;">
          <button id="btnJump" class="btn btn-dark opacity-75 rounded-circle p-3 shadow" style="width: 70px; height: 70px;">⏫</button>
        </div>
      </div>
    </div>

    <div class="mt-4 text-center text-secondary small">
      <p>Dùng phím mũi tên hoặc các nút trên màn hình để chơi.</p>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div class="modal fade" id="gameOverModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-primary border-3">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="winnerTitle">KẾT THÚC!</h5>
        </div>
        <div class="modal-body text-center">
          <p id="finalScoreMsg" class="h4 mb-3"></p>
        </div>
        <div class="modal-footer border-secondary justify-content-center">
          <button type="button" class="btn btn-primary" id="modalRestartBtn">Chơi lại</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
