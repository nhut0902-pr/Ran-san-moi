<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rắn Săn Mồi - Snake Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">
  <div class="container py-4">
    <h1 class="text-center mb-4">🐍 Rắn Săn Mồi</h1>

    <div class="row justify-content-center mb-4">
      <div class="col-md-10 col-lg-8">
        <div class="card bg-secondary text-white shadow">
          <div class="card-body">
            <div class="row g-3 align-items-end">
              <div class="col-6 col-md-3">
                <label for="modeSelect" class="form-label small">Chế độ</label>
                <select id="modeSelect" class="form-select bg-dark text-white border-secondary">
                  <option value="player">Người chơi</option>
                  <option value="bot">Máy (Bot)</option>
                </select>
              </div>
              <div id="botDifficultyContainer" class="col-6 col-md-3 d-none">
                <label for="botDifficulty" class="form-label small">Độ khó Bot</label>
                <select id="botDifficulty" class="form-select bg-dark text-white border-secondary">
                  <option value="easy">Dễ</option>
                  <option value="hard">Khó</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <label for="speedSelect" class="form-label small">Tốc độ</label>
                <select id="speedSelect" class="form-select bg-dark text-white border-secondary">
                  <option value="200">Chậm</option>
                  <option value="120" selected>Vừa</option>
                  <option value="70">Nhanh</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <label for="sizeSelect" class="form-label small">Kích thước</label>
                <select id="sizeSelect" class="form-select bg-dark text-white border-secondary">
                  <option value="300">Nhỏ</option>
                  <option value="400" selected>Vừa</option>
                  <option value="500">Lớn</option>
                </select>
              </div>
              <div class="col-12 col-md-3 d-flex align-items-center justify-content-center">
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="soundToggle" checked>
                  <label class="form-check-label" for="soundToggle">Âm thanh</label>
                </div>
              </div>
              <div class="col-12 d-flex justify-content-center mt-3">
                <button id="startBtn" class="btn btn-success px-4 me-2">Bắt đầu</button>
                <button id="restartBtn" class="btn btn-warning px-4 d-none">Chơi lại</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-center gap-4 mb-3">
      <div class="p-2 bg-primary rounded shadow">
        <h5 class="mb-0 text-center">🎯 Điểm: <span id="score">0</span></h5>
      </div>
      <div class="p-2 bg-danger rounded shadow">
        <h5 class="mb-0 text-center">🏆 Kỷ lục: <span id="high-score">0</span></h5>
      </div>
    </div>

    <div class="game-container text-center">
      <canvas id="gameCanvas" width="400" height="400" class="shadow-lg"></canvas>
    </div>

    <div class="mt-4 text-center text-secondary small">
      <p>Dùng các phím mũi tên hoặc vuốt trên màn hình để điều khiển.</p>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div class="modal fade" id="gameOverModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-danger border-3">
        <div class="modal-header border-secondary">
          <h5 class="modal-title text-danger">GAME OVER!</h5>
        </div>
        <div class="modal-body text-center">
          <p id="finalScore" class="h4 mb-3"></p>
          <p id="highScoreMsg" class="text-warning fw-bold d-none">KỶ LỤC MỚI!</p>
        </div>
        <div class="modal-footer border-secondary justify-content-center">
          <button type="button" class="btn btn-primary" id="modalRestartBtn">Chơi lại</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
